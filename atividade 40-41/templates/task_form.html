{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>{% if task %}Editar{% else %}Nova{% endif %} Tarefa</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Título</label>
                <input type="text" name="titulo" class="form-control" value="{{ task['titulo'] if task else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descrição</label>
                <textarea name="descricao" class="form-control" rows="3">{{ task['descricao'] if task else '' }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="Pendente" {% if task and task['status'] == 'Pendente' %}selected{% endif %}>Pendente</option>
                    <option value="Em andamento" {% if task and task['status'] == 'Em andamento' %}selected{% endif %}>Em andamento</option>
                    <option value="Concluída" {% if task and task['status'] == 'Concluída' %}selected{% endif %}>Concluída</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Salvar</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
