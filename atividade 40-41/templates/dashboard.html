{% extends "base.html" %}
{% block content %}
<div class="row mb-4">
    <div class="col">
        <blockquote class="blockquote text-center p-3 bg-body-secondary rounded">
            <p class="mb-1"><i class="bi bi-quote"></i> {{ quote }}</p>
            <footer class="blockquote-footer">Conselho do Dia</footer>
        </blockquote>
    </div>
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Minhas Tarefas</h2>
    <div>
        <select id="filterStatus" class="form-select d-inline-block w-auto me-2">
            <option value="Todos">Todos os Status</option>
            <option value="Pendente">Pendente</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Concluída">Concluída</option>
        </select>
        <a href="{{ url_for('nova_tarefa') }}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nova Tarefa</a>
    </div>
</div>

<div class="row" id="taskList">
    </div>
{% endblock %}
