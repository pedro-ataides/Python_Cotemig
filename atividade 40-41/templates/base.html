<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4 border-bottom">
        <div class="container">
            <a class="navbar-brand font-monospace fw-bold" href="#">TaskMaster</a>
            <div class="d-flex align-items-center">
                {% if session.get('usuario_id') %}
                    <a class="nav-link me-3" href="{{ url_for('dashboard') }}">Tarefas</a>
                    <a class="nav-link me-3" href="{{ url_for('progresso') }}">Progresso</a>
                    <a class="nav-link me-3 text-danger" href="{{ url_for('logout') }}">Sair</a>
                {% endif %}
                <button class="btn btn-outline-secondary btn-sm" id="toggleTheme">
                    <i class="bi bi-moon-stars"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
